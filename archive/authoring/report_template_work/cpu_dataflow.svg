<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">MiniRISC-16 CPU and Memory Dataflow</title>
  <desc id="desc">Single-cycle control and data paths from program counter through instruction decode, register file, ALU, writeback, data memory, peripherals and next program counter selection.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker><style>.bg{fill:#f7f9fc}.box{fill:#fff;stroke:#64748b;stroke-width:3}.blue{fill:#eaf2ff;stroke:#2563eb;stroke-width:4}.green{fill:#ecfdf3;stroke:#16a34a;stroke-width:3}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.t{font:700 30px "Segoe UI",Arial,sans-serif;fill:#172033}.h{font:700 22px "Segoe UI",Arial,sans-serif;fill:#172033}.b{font:400 18px "Segoe UI",Arial,sans-serif;fill:#475569}.l{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}.c{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#a)}.d{fill:none;stroke:#ea580c;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#a)}.label{font:500 16px "Segoe UI",Arial,sans-serif;fill:#334155}</style></defs>
  <rect class="bg" width="1800" height="900"/><text class="t" x="55" y="55">MiniRISC-16 Single-Cycle Dataflow</text>
  <rect class="blue" x="60" y="150" width="200" height="120" rx="12"/><text class="h" x="100" y="195">10-bit PC</text><text class="b" x="90" y="235">Current address</text>
  <rect class="green" x="330" y="150" width="260" height="120" rx="12"/><text class="h" x="365" y="195">Program RAM</text><text class="b" x="365" y="235">1K × 16 instruction</text>
  <rect class="box" x="665" y="110" width="280" height="150" rx="12"/><text class="h" x="705" y="155">Controller</text><text class="b" x="705" y="195">Opcode decode</text><text class="b" x="705" y="228">Control generation</text>
  <rect class="blue" x="665" y="330" width="280" height="150" rx="12"/><text class="h" x="705" y="375">Register File</text><text class="b" x="705" y="415">R0–R3 read ports</text><text class="b" x="705" y="448">Synchronous writeback</text>
  <rect class="box" x="1015" y="330" width="260" height="150" rx="12"/><text class="h" x="1065" y="375">ALU</text><text class="b" x="1055" y="415">Arithmetic and logic</text><text class="b" x="1055" y="448">Z/N/C/V result flags</text>
  <rect class="blue" x="1350" y="330" width="300" height="150" rx="12"/><text class="h" x="1400" y="375">Writeback MUX</text><text class="b" x="1390" y="415">ALU · I/O · data RAM</text><text class="b" x="1390" y="448">Selected value to Rd</text>
  <rect class="green" x="1015" y="610" width="260" height="125" rx="12"/><text class="h" x="1055" y="655">Data RAM</text><text class="b" x="1055" y="695">256 × 16 · LDR/STR</text>
  <rect class="orange" x="1350" y="610" width="300" height="125" rx="12"/><text class="h" x="1390" y="655">I/O Peripherals</text><text class="b" x="1390" y="695">INP/OUP · 8-bit address</text>
  <rect class="box" x="330" y="610" width="260" height="125" rx="12"/><text class="h" x="375" y="655">Next-PC MUX</text><text class="b" x="360" y="695">PC+1 · JZ · JUMP · JMPA</text>
  <rect class="box" x="665" y="610" width="280" height="125" rx="12"/><text class="h" x="710" y="655">Status Register</text><text class="b" x="710" y="695">Stored Z/N/C/V flags</text>
  <path class="c" d="M260 210 H320"/><path class="c" d="M590 210 H655"/><path class="l" d="M805 260 V320"/><path class="c" d="M945 405 H1005"/><path class="c" d="M1275 405 H1340"/><path class="c" d="M1500 480 V535 H805 V490"/>
  <path class="c" d="M1145 480 V600"/><path class="c" d="M1145 610 V535 H1500 V490"/><path class="c" d="M1500 610 V490"/><path class="c" d="M945 445 H980 V672 H1005"/>
  <path class="l" d="M1145 480 V545 H805 V600"/><path class="d" d="M805 610 V540 H460 V600"/><path class="c" d="M460 610 V300 H160 V280"/>
  <path class="d" d="M805 260 V295 H460 V600"/>
  <text class="label" x="285" y="198">address</text><text class="label" x="605" y="198">instruction</text><text class="label" x="955" y="393">operands</text><text class="label" x="1280" y="393">ALU result</text><text class="label" x="1170" y="590">data bus</text><text class="label" x="1490" y="590">I/O bus</text><text class="label" x="485" y="585">pc_next</text>
  <text class="b" x="55" y="835">All combinational selection and execution occurs between adjacent rising edges; architectural state commits at the next edge.</text>
</svg>
