<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">MiniRISC-16 Pre-board Architecture</title>
  <desc id="desc">The system top contains reset conditioning, a 256 word instruction ROM, an 8-bit program-counter CPU core, and an 8-bit bidirectional GPIO peripheral.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
    <style>.bg{fill:#f7f9fc}.outer{fill:#eef4ff;stroke:#2563eb;stroke-width:4}.box{fill:#fff;stroke:#64748b;stroke-width:3}.cpu{fill:#eaf2ff;stroke:#2563eb;stroke-width:4}.mem{fill:#ecfdf3;stroke:#16a34a;stroke-width:3}.io{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.t{font:700 30px "Segoe UI",Arial,sans-serif;fill:#172033}.h{font:700 23px "Segoe UI",Arial,sans-serif;fill:#172033}.b{font:400 19px "Segoe UI",Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.bus{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.bi{fill:none;stroke:#ea580c;stroke-width:4;marker-start:url(#arrow);marker-end:url(#arrow)}.label{font:500 17px "Segoe UI",Arial,sans-serif;fill:#334155}</style>
  </defs>
  <rect class="bg" width="1800" height="1000"/>
  <text class="t" x="60" y="60">MiniRISC-16 Pre-board Architecture</text>
  <rect class="outer" x="150" y="120" width="1500" height="720" rx="18"/>
  <text class="h" x="195" y="170">system_top</text>
  <rect class="box" x="215" y="215" width="300" height="130" rx="12"/>
  <text class="h" x="250" y="260">Reset Conditioner</text>
  <text class="b" x="250" y="300">Immediate assertion</text>
  <text class="b" x="250" y="330">Two-stage release</text>
  <rect class="mem" x="215" y="465" width="340" height="150" rx="12"/>
  <text class="h" x="255" y="515">Instruction Memory</text>
  <text class="b" x="255" y="558">256 × 16 ROM</text>
  <text class="b" x="255" y="592">Combinational read</text>
  <rect class="cpu" x="670" y="255" width="470" height="430" rx="16"/>
  <text class="h" x="720" y="305">cpu_core</text>
  <rect class="box" x="725" y="350" width="360" height="110" rx="10"/>
  <text class="h" x="765" y="395">Controller</text>
  <text class="b" x="765" y="430">Opcode decode and control</text>
  <rect class="box" x="725" y="510" width="360" height="120" rx="10"/>
  <text class="h" x="765" y="552">Datapath</text>
  <text class="b" x="765" y="585">4 × 16 registers · ALU · Z</text>
  <text class="b" x="765" y="615">8-bit PC and next-PC logic</text>
  <rect class="io" x="1260" y="360" width="310" height="255" rx="12"/>
  <text class="h" x="1300" y="408">gpio8</text>
  <text class="b" x="1300" y="450">GPIO_OUT at 0x10</text>
  <text class="b" x="1300" y="487">GPIO_IN at 0x11</text>
  <text class="b" x="1300" y="524">GPIO_DIR at 0x12</text>
  <text class="b" x="1300" y="565">8 bidirectional pins</text>
  <path class="line" d="M515 280 H655"/><text class="label" x="550" y="265">rst</text>
  <path class="bus" d="M555 520 H655"/><text class="label" x="570" y="505">instruction[15:0]</text>
  <path class="bus" d="M670 585 H565"/><text class="label" x="585" y="615">PC[7:0]</text>
  <path class="bus" d="M1140 450 H1245"/><text class="label" x="1155" y="435">I/O request</text>
  <path class="bus" d="M1260 555 H1145"/><text class="label" x="1155" y="585">read data</text>
  <path class="bi" d="M1575 490 H1710"/><text class="label" x="1590" y="470">gpio[7:0]</text>
  <text class="b" x="155" y="910">The design baseline ends at the generic clock, reset, and GPIO boundary; board-specific peripherals are verification wrappers.</text>
</svg>
